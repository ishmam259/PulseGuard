services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pulseguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wirelight
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:wirelight@db:5432/pulseguard
      JWT_SECRET: pulseguard_jwt_secret_2026
      JWT_REFRESH_SECRET: pulseguard_refresh_secret_2026
      AI_WORKER_URL: http://ai-worker:8000
      PORT: 5000
      NODE_ENV: production
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CHAT_SECRET: ${CHAT_SECRET}

  ai-worker:
    build: ./ai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:wirelight@db:5432/pulseguard
      GROQ_API_KEY: ${GROQ_API_KEY}

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api

  matrix-chat:
    image: matrixconduit/matrix-conduit:latest
    container_name: matrix_conduit
    ports:
      - "8008:6167" # Maps port 8008 on your machine to Conduit's internal port
    environment:
      CONDUIT_CONFIG: ""
      # 1. Your Server Identity (Change this to your Public IP when you deploy later)
      CONDUIT_SERVER_NAME: "${CHAT_DOMAIN}:8008"
      CONDUIT_JWT_SECRET: "${CHAT_SECRET}"
      
      # 3. Server Engine Settings (Don't change these)
      CONDUIT_PORT: "6167"
      CONDUIT_ADDRESS: "0.0.0.0"
      CONDUIT_ALLOW_REGISTRATION: "true"
    volumes:
      - ./matrix_data:/srv/conduit/data
    restart: unless-stopped

volumes:
  pg_data:
